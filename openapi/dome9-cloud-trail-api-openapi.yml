        cloudAccountId:
          format: uuid
          description: CloudAccountId
          type: string
          readOnly: true
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          format: int64
          description: AccountId
          type: integer
          readOnly: true
        cloudWatchLogsLogGroupArn:
          description: 'Gets and sets the property CloudWatchLogsLogGroupArn.

            Specifies an Amazon Resource Name (ARN), a unique identifier that represents

            the log group to which CloudTrail logs will be delivered.'
          type: string
        cloudWatchLogsRoleArn:
          description: 'Gets and sets the property CloudWatchLogsRoleArn.

            Specifies the role for the CloudWatch Logs endpoint to assume to write to

            a user''s log group.'
          type: string
        homeRegion:
          description: 'Gets and sets the property HomeRegion.

            The region in which the trail was created.'
          type: string
        includeGlobalServiceEvents:
          description: "Gets and sets the property IncludeGlobalServiceEvents.\nSet to True to include AWS API calls from AWS global services such as IAM.\n Otherwise, False."
          type: boolean
        isMultiRegionTrail:
          description: 'Gets and sets the property IsMultiRegionTrail.

            Specifies whether the trail belongs only to one region or exists in all regions.'
          type: boolean
        kmsKeyId:
          description: 'Gets and sets the property KmsKeyId.

            Specifies the KMS key ID that encrypts the logs delivered by CloudTrail.

            The value is a fully specified ARN to a KMS key in the format:

            arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012'
          type: string
        logFileValidationEnabled:
          description: 'Gets and sets the property LogFileValidationEnabled.

            Specifies whether log file validation is enabled.'
          type: boolean
        s3BucketName:
          description: 'Gets and sets the property S3BucketName.

            Name of the Amazon S3 bucket into which CloudTrail delivers your trail files.

            See Amazon S3 Bucket Naming Requirements.'
          type: string
        s3KeyPrefix:
          description: 'Gets and sets the property S3KeyPrefix.

            Specifies the Amazon S3 key prefix that comes after the name of the bucket

            you have designated for log file delivery. For more information, see Finding

            Your CloudTrail Log Files.The maximum length is 200 characters.'
          type: string
        snsTopicArn:
          description: 'Gets and sets the property SnsTopicARN.

            Specifies the ARN of the Amazon SNS topic that CloudTrail uses to send notifications

            when log files are delivered. The format of a topic ARN is:

            arn:aws:sns:us-east-1:123456789012:MyTopic'
          type: string
        snsTopicName:
          description: 'Gets and sets the property SnsTopicName.

            This field is deprecated. Use SnsTopicARN.'
          type: string
        trailArn:
          description: 'Gets and sets the property TrailARN.

            Specifies the ARN of the trail. The format of a trail ARN is:

            arn:aws:cloudtrail:us-east-1:123456789012:trail/MyTrail'
          type: string
        cloudTrailStatus:
