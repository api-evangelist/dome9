openapi: 3.2.0
info:
  version: v2
  title: Dome9. Aws Security Group Policy API
servers:
- url: https://api.dome9.com
tags:
- name: Aws Security Group Policy
  type: NetworkSecurity
paths:
  /v2/AwsSecurityGroupPolicy/CloudAccount/{id}:
    get:
      tags:
      - Aws Security Group Policy
      summary: Get all security groups policies of cloud account by cloud account id
      operationId: AwsSecurityGroupPolicy_GetByCloudAccount
      parameters:
      - name: id
        in: path
        description: cloud account id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
  /v2/AwsSecurityGroupPolicy/CloudAccount/{cloudAccountId}/Policy/{externalId}:
    get:
      tags:
      - Aws Security Group Policy
      summary: Get security group policy by external security group id and cloud account id
      operationId: AwsSecurityGroupPolicy_GetByExternalSecurityGroupId
      parameters:
      - name: cloudAccountId
        in: path
        description: Cloud account id
        required: true
        schema:
          type: string
          format: uuid
      - name: externalId
        in: path
        description: Aws security group id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
    delete:
      tags:
      - Aws Security Group Policy
      summary: Delete an AWS security group
      operationId: AwsSecurityGroupPolicy_DeleteCloudSecurityGroup
      parameters:
      - name: cloudAccountId
        in: path
        description: Cloud account id
        required: true
        schema:
          type: string
          format: uuid
      - name: externalId
        in: path
        description: Aws security group id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v2/AwsSecurityGroupPolicy/CloudAccount/{cloudAccountId}/Policy/{externalId}/ProtectionMode:
    post:
      tags:
      - Aws Security Group Policy
      summary: Update protection mode to security group
      operationId: AwsSecurityGroupPolicy_PostProtectionMode
      parameters:
      - name: cloudAccountId
        in: path
        description: Cloud account id
        required: true
        schema:
          type: string
          format: uuid
      - name: externalId
        in: path
        description: Aws security group id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupProtectionModeChangeViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupProtectionModeChangeViewModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupProtectionModeChangeViewModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupProtectionModeChangeViewModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupProtectionModeChangeViewModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupProtectionModeChangeViewModel'
        description: 'protectionMode: FullManage / ReadOnly'
        required: true
  /v2/AwsSecurityGroupPolicy/CloudAccount/{cloudAccountId}/Policy/{externalId}/Services/{policyType}:
    put:
      tags:
      - Aws Security Group Policy
      summary: Update a service (rule) for an AWS security group
      operationId: AwsSecurityGroupPolicy_UpdateServiceInSecurityGroup
      parameters:
      - name: cloudAccountId
        in: path
        description: Cloud account id
        required: true
        schema:
          type: string
          format: uuid
      - name: externalId
        in: path
        description: Aws security group id
        required: true
        schema:
          type: string
      - name: policyType
        in: path
        description: the service type (Inbound / Outbound)
        required: true
        schema:
          type: string
          enum:
          - Inbound
          - Outbound
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupServiceViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupServiceViewModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupServiceViewModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupServiceViewModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupServiceViewModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupServiceViewModel'
        description: updated details for the service
        required: true
    post:
      tags:
      - Aws Security Group Policy
      summary: Creat a new Service (rule) for the security group
      operationId: AwsSecurityGroupPolicy_AddServiceToSecurityGroup
      parameters:
      - name: cloudAccountId
        in: path
        description: Cloud account id
        required: true
        schema:
          type: string
          format: uuid
      - name: externalId
        in: path
        description: Aws security group id
        required: true
        schema:
          type: string
      - name: policyType
        in: path
        description: the service type (Inbound / Outbound))
        required: true
        schema:
          type: string
          enum:
          - Inbound
          - Outbound
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyServiceViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyServiceViewModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyServiceViewModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyServiceViewModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyServiceViewModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyServiceViewModel'
        description: details for the service
        required: true
  /v2/AwsSecurityGroupPolicy/CloudAccount/{cloudAccountId}/Policy/{externalId}/Services/{policyType}/{serviceId}:
    delete:
      tags:
      - Aws Security Group Policy
      summary: Delete a service (rule) from an AWS security group
      operationId: AwsSecurityGroupPolicy_DeleteServiceFromSecurityGroup
      parameters:
      - name: cloudAccountId
        in: path
        description: Cloud account id
        required: true
        schema:
          type: string
          format: uuid
      - name: externalId
        in: path
        description: Aws security group id
        required: true
        schema:
          type: string
      - name: policyType
        in: path
        description: the service type (Inbound / Outbound)
        required: true
        schema:
          type: string
          enum:
          - Inbound
          - Outbound
      - name: serviceId
        in: path
        description: the service id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v2/AwsSecurityGroupPolicy/CloudAccount/{cloudAccountId}/Policy/{externalId}/tags:
    post:
      tags:
      - Aws Security Group Policy
      summary: Update tags
      operationId: AwsSecurityGroupPolicy_UpdateTags
      parameters:
      - name: cloudAccountId
        in: path
        description: Cloud account id
        required: true
        schema:
          type: string
          format: uuid
      - name: externalId
        in: path
        description: Aws security group id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupTagsChangeViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupTagsChangeViewModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupTagsChangeViewModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupTagsChangeViewModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupTagsChangeViewModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupTagsChangeViewModel'
        description: 'Tags model - {{ "key" : "value" }}'
        required: true
  /v2/AwsSecurityGroupPolicy:
    get:
      tags:
      - Aws Security Group Policy
      summary: Get a list of all security groups
      operationId: AwsSecurityGroupPolicy_GetAllSecurityGroupsOfAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupPolicyViewModel'
    post:
      tags:
      - Aws Security Group Policy
      summary: Create a new AWS security group
      operationId: AwsSecurityGroupPolicy_CreateAwsSecurityGroup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupBaseViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupBaseViewModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupBaseViewModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupBaseViewModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupBaseViewModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudSecurityGroupBaseViewModel'
        description: details for the new AWS security group
        required: true
