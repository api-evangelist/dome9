          type: integer
        awsRdsInstances:
          format: int32
          type: integer
        awsInstances:
          format: int32
          type: integer
        awsElbs:
          format: int32
          type: integer
        awsAlbs:
          format: int32
          type: integer
        awsNlbs:
          format: int32
          type: integer
        agents:
          format: int32
          type: integer
        awsLambdaFunctions:
          format: int32
          type: integer
        awsAccounts:
          format: int32
          type: integer
        awsSecurityGroups:
          format: int32
          type: integer
        awsRedshiftClusters:
          format: int32
          type: integer
        dome9SecurityGroups:
          format: int32
          type: integer
        azureAccounts:
          format: int32
          type: integer
        azureVms:
          format: int32
          type: integer
        azureElbs:
          format: int32
          type: integer
        azureNsgs:
          format: int32
          type: integer
