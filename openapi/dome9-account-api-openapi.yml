          - Undecided
          - Beta_Trial_Plan
          - FREE
          - METERED
          - CF_BASIC
          - CF_DEFAULT
          - Starter
          - Growth
          - Large
          - XL
          - SecOpsR2
          - SecOpsR5
          - Enterprise
          - FREE_Unlimited
          - SecOpsX20
          - SecOpsX50
          - SecOpsX100
          - Rackers
          - Amazonian
          - Reseller
          - SecOpsX10
          - MSP
          - POC
          - AWS_Metered
          - Enterprise_Trial
          - Enterprise_Friend
          - Core_M
          - Core_L
          - Enterprise_New
          - Googler
          - CheckpointEmployee
          - Enterprise_PAYG
          type: string
        name:
          type: string
        phoneNumber:
          type: string
        message:
          type: string
    Dome9.Web.Api.Models.ManagingAccountViewModel:
      type: object
      properties:
        accountName:
          type: string
    Dome9.Web.Api.Models.AccountStatsViewModel:
