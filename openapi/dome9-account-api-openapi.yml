          format: int32
          type: integer
        ociOnlineBillableVirtualMachinesCount:
          format: int32
          type: integer
        ociDatabasesCount:
          format: int32
          type: integer
        source:
          enum:
          - ElasticSearch
          - Database
          type: string
        timeStamp:
          format: date-time
          type: string
