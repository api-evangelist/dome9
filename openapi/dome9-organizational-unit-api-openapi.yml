openapi: 3.2.0
info:
  version: v2
  title: Dome9. Organizational Unit API
  description: Manage Organizational Units
servers:
- url: https://api.dome9.com
tags:
- name: Organizational Unit
  description: Manage Organizational Units
  type: InventoryAwsGlobal
