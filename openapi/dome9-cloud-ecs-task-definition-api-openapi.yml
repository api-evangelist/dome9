openapi: 3.2.0
info:
  version: v2
  title: Dome9. Cloud Ecs Task Definition API
servers:
- url: https://api.dome9.com
tags:
- name: Cloud Ecs Task Definition
  type: InventoryAwsComputeAndContainers
paths:
  /v2/CloudEcsTaskDefinition:
    get:
      tags:
      - Cloud Ecs Task Definition
      operationId: CloudEcsTaskDefinition_Get
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudEcsTaskDefinitionViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudEcsTaskDefinitionViewModel'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudEcsTaskDefinitionViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudEcsTaskDefinitionViewModel'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudEcsTaskDefinitionViewModel'
      summary: Cloud ecs task definition get
      x-summary-source: derived
components:
  schemas:
    Dome9.Web.Api.AwsECSUlimitViewModel:
      type: object
      properties:
        hardLimit:
          format: int32
          type: integer
        name:
          type: string
        softLimit:
          format: int32
          type: integer
    Dome9.Web.Api.AwsECSLogConfigurationViewModel:
      type: object
      properties:
        logDriver:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/System.Collections.Generic.KeyValuePair_System.String_System.String'
    Dome9.Web.Api.AwsECSVolumeFromViewModel:
      type: object
      properties:
        readOnly:
          type: boolean
        sourceContainer:
          type: string
    Dome9.Web.Api.AwsECSHostVolumePropertiesViewModel:
      type: object
      properties:
        sourcePath:
          type: string
    Dome9.Web.Api.CloudEcsTaskDefinitionViewModel:
      type: object
      properties:
        containerDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.AwsECSContainerDefinitionViewModel'
        family:
          type: string
        networkMode:
          type: string
        placementConstraints:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.AwsECSTaskDefinitionPlacementConstraintViewModel'
        requiresAttributes:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.AwsECSAttributeViewModel'
        revision:
          format: int32
          type: integer
        status:
          type: string
        taskDefinitionArn:
          type: string
