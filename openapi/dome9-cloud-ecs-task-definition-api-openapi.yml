          items:
            type: string
        dockerLabels:
          type: array
          items:
            $ref: '#/components/schemas/System.Collections.Generic.KeyValuePair_System.String_System.String'
        dockerSecurityOptions:
          type: array
          items:
            type: string
        entryPoint:
          type: array
          items:
            type: string
        environment:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.AwsECSKeyValuePairViewModel'
        essential:
          type: boolean
        extraHosts:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.AwsECSHostEntryViewModel'
        hostname:
          type: string
        image:
          type: string
        links:
          type: array
          items:
            type: string
        logConfiguration:
          $ref: '#/components/schemas/Dome9.Web.Api.AwsECSLogConfigurationViewModel'
        memory:
          format: int32
          type: integer
        memoryReservation:
          format: int32
          type: integer
        mountPoints:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.AwsECSMountPointViewModel'
        name:
          type: string
        portMappings:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.AwsECSPortMappingViewModel'
        privileged:
          type: boolean
        readonlyRootFilesystem:
          type: boolean
        ulimits:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.AwsECSUlimitViewModel'
        user:
          type: string
        volumesFrom:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.AwsECSVolumeFromViewModel'
        workingDirectory:
          type: string
    Dome9.Web.Api.AwsECSMountPointViewModel:
      type: object
      properties:
        containerPath:
          type: string
        readOnly:
          type: boolean
        sourceVolume:
          type: string
    Dome9.Web.Api.AwsECSPortMappingViewModel:
      type: object
      properties:
        containerPort:
          format: int32
          type: integer
        hostPort:
          format: int32
          type: integer
        protocol:
          type: string
    Dome9.Web.Api.AwsECSVolumeViewModel:
      type: object
      properties:
        host:
          $ref: '#/components/schemas/Dome9.Web.Api.AwsECSHostVolumePropertiesViewModel'
        name:
          type: string
    System.Collections.Generic.KeyValuePair_System.String_System.String:
      type: object
      properties:
        key:
          type: string
          readOnly: true
        value:
          type: string
          readOnly: true
    Dome9.Web.Api.AwsECSHostEntryViewModel:
      type: object
      properties:
        hostname:
          type: string
        ipAddress:
          type: string
  securitySchemes:
    API_key_V2:
      type: http
      scheme: basic
