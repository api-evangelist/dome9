          type: string
    Dome9.Web.Api.AwsECSKeyValuePairViewModel:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
    Dome9.Web.Api.AwsECSTaskDefinitionPlacementConstraintViewModel:
      type: object
      properties:
        expression:
          type: string
        type:
          type: string
    Dome9.Web.Api.AwsECSContainerDefinitionViewModel:
      type: object
      properties:
        command:
          type: array
          items:
            type: string
        cpu:
          format: int32
          type: integer
        disableNetworking:
          type: boolean
        dnsSearchDomains:
          type: array
          items:
            type: string
        dnsServers:
