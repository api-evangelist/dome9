openapi: 3.2.0
info:
  version: v2
  title: Dome9. Aws Eks API
servers:
- url: https://api.dome9.com
tags:
- name: Aws Eks
  type: InventoryAwsComputeAndContainers
paths:
  /v2/AwsEks/GetByCloudAccount:
    get:
      tags:
      - Aws Eks
      operationId: AwsEks_GetByCloudAccount
      parameters:
      - name: cloudAccountId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
      summary: Aws eks get by cloud account
      x-summary-source: derived
  /v2/AwsEks:
    get:
      tags:
      - Aws Eks
      operationId: AwsEks_Get
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
      summary: Aws eks get
      x-summary-source: derived
  /v2/AwsEks/{id}:
    get:
      tags:
      - Aws Eks
      operationId: AwsEks_Get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
            text/json:
              schema:
