            application/xml:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.AwsEks.AwsEksClusterViewModel'
      summary: Aws eks get
      x-summary-source: derived
