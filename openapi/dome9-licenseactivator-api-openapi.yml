          - CP_CGD9_CNP_100_PS
          - CP_CGD9_CNP_100_PS_TESTPLAN
          type: string
        seats:
          format: int32
          type: integer
        startDate:
          format: date-time
          type: string
        expirationDate:
          format: date-time
          type: string
        amountOfYears:
          format: int32
          type: integer
        macro:
          type: string
    Dome9.Web.Api.LicenseActivator.LicenseGetRequestModel:
      required:
      - userName
      - password
      type: object
      properties:
        userName:
          type: string
        password:
          type: string
    Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel:
      type: object
      properties:
        accountId:
          format: int64
          type: integer
        userCenterId:
          format: int64
          type: integer
        accountName:
          type: string
        productId:
          type: string
        sku:
          type: string
        productType:
          enum:
          - Unknown
          - Dome9
          - Logic
          type: string
        macro:
          type: string
        qty:
          format: int32
          type: integer
        startDate:
          format: date-time
          type: string
        expirationDate:
          format: date-time
          type: string
    Dome9.Web.Api.LicenseActivator.LicenseActivateRequestModel:
      required:
      - licenses
      - userName
      - password
      type: object
      properties:
        licenses:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivatorViewModel'
        userName:
          type: string
        password:
          type: string
  securitySchemes:
    API_key_V2:
      type: http
      scheme: basic
