openapi: 3.2.0
info:
  version: v2
  title: Dome9. License Activator API
servers:
- url: https://api.dome9.com
tags:
- name: LicenseActivator
  type: Unclassified
paths:
  /v2/LicenseActivator/GetAllProductKeys:
    get:
      tags:
      - LicenseActivator
      summary: Returns all user activate license
      operationId: LicenseActivator_GetAllProductKeys
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel'
  /v2/LicenseActivator/GetLicense/{productKey}:
    get:
      tags:
      - LicenseActivator
      summary: Returns license by given product id
      operationId: LicenseActivator_GetLicenseByProductKey
      parameters:
      - name: productKey
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.Dome9LicenseViewModel'
  /v2/LicenseActivator/ListAllDome9LicensesFromUserCenter:
    post:
      tags:
      - LicenseActivator
      summary: Returns user licenses
      operationId: LicenseActivator_GetAllDome9LicensesFromUserCenter
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivatorViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivatorViewModel'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivatorViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivatorViewModel'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivatorViewModel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseGetRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseGetRequestModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseGetRequestModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseGetRequestModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseGetRequestModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseGetRequestModel'
        description: Model with UserCenter credentials.
        required: true
  /v2/LicenseActivator/ActivateUserLicense:
    post:
      tags:
      - LicenseActivator
      summary: Activate given license to the account
      operationId: LicenseActivator_ActivateUserLicense
      responses:
        '204':
          description: No Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivateRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivateRequestModel'
          text/html:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivateRequestModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivateRequestModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivateRequestModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivateRequestModel'
        description: Model with licenses to activate.
        required: true
components:
  schemas:
    Dome9.Web.Api.LicenseActivator.LicenseActivatorViewModel:
      required:
      - services
      type: object
      properties:
        userCenterAccountId:
          format: int64
          type: integer
        accountName:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.LicenseActivator.LicenseActivatorViewModelService'
    Dome9.Web.Api.LicenseActivator.LicenseActivatorViewModelService:
      type: object
      properties:
        id:
          type: string
        productType:
          enum:
          - Unknown
          - Dome9
          - Logic
          type: string
        sku:
          enum:
          - Undefined
          - CPCGD9CNX100CONTRACTEVAL
          - CPCGD9CNP100CONTRACTEVAL
          - CPCGD9CNP25CONTRACT1Y
          - CPCGD9CNP25CONTRACTREN1Y
          - CPCGD9CNP25CONTRACTREN2Y
          - CPCGD9CNP25CONTRACTREN3Y
          - CPCGD9CNP25CONTRACT2Y
