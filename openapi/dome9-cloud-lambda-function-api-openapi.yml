openapi: 3.2.0
info:
  version: v2
  title: Dome9. Cloud Lambda Function API
  description: Cloud Lambda Function
servers:
- url: https://api.dome9.com
tags:
- name: Cloud Lambda Function
  description: Cloud Lambda Function
