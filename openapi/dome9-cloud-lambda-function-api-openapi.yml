paths:
  /v2/CloudLambdaFunction/by-external-id-and-cloud-account:
    get:
      tags:
      - Cloud Lambda Function
      operationId: CloudLambdaFunction_GetByExternalIdAndCloudAccountAsync
      parameters:
      - name: externalId
        in: query
        required: true
        schema:
          type: string
      - name: cloudAccountId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
      summary: Cloud lambda function get by external id and cloud account async
      x-summary-source: derived
  /v2/CloudLambdaFunction:
    get:
      tags:
      - Cloud Lambda Function
      operationId: CloudLambdaFunction_Get
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
      summary: Cloud lambda function get
      x-summary-source: derived
  /v2/CloudLambdaFunction/{id}:
    get:
      tags:
      - Cloud Lambda Function
      operationId: CloudLambdaFunction_Get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudLambdaFunctionViewModel'
      summary: Cloud lambda function get
      x-summary-source: derived
