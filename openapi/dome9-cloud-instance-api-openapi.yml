  /v2/cloudinstance/by-external-id-and-cloud-account:
    get:
      tags:
      - Cloud Instance
      operationId: CloudInstance_GetByIdAndCloudAccountAsync
      parameters:
      - name: externalId
        in: query
        required: true
        schema:
          type: string
      - name: cloudAccountId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudInstanceViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudInstanceViewModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudInstanceViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudInstanceViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.Models.CloudInstanceViewModel'
      summary: Cloud instance get by id and cloud account async
      x-summary-source: derived
