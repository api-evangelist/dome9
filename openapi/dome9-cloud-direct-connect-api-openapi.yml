openapi: 3.2.0
info:
  version: v2
  title: Dome9. Cloud Direct Connect API
servers:
- url: https://api.dome9.com
tags:
- name: Cloud Direct Connect
  type: InventoryAwsNetworkingAndContentDelivery
paths:
  /v2/CloudDirectConnect/{directConnectId}/metrics:
    get:
      tags:
      - Cloud Direct Connect
      summary: Fetches the last day metrics for the given direct connect connection
      operationId: CloudDirectConnect_GetMetrics
      parameters:
      - name: directConnectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.CloudDirectConnect.AwsDirectConnectMetricsViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.CloudDirectConnect.AwsDirectConnectMetricsViewModel'
            text/html:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.CloudDirectConnect.AwsDirectConnectMetricsViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.CloudDirectConnect.AwsDirectConnectMetricsViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/Dome9.Web.Api.CloudDirectConnect.AwsDirectConnectMetricsViewModel'
  /v2/CloudDirectConnect:
    get:
      tags:
      - Cloud Direct Connect
      operationId: CloudDirectConnect_Get
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudDirectConnect.CloudDirectConnectViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudDirectConnect.CloudDirectConnectViewModel'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudDirectConnect.CloudDirectConnectViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudDirectConnect.CloudDirectConnectViewModel'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dome9.Web.Api.CloudDirectConnect.CloudDirectConnectViewModel'
      summary: Cloud direct connect get
      x-summary-source: derived
