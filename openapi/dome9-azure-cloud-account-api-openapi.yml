  /v2/AzureCloudAccount/{id}/MissingPermissions:
    get:
      tags:
      - Azure Cloud Account
      summary: Get a list of missing permissions for a specific account.
      operationId: AzureCloudAccount_GetMissingPermissionsAsync
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      - name: showIgnored
        in: query
        description: ''
        required: false
        schema:
          type: boolean
