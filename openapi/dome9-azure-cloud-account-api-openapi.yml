openapi: 3.2.0
info:
  version: v2
  title: Dome9. Azure Cloud Account API
  description: Onboard Azure accounts
servers:
- url: https://api.dome9.com
tags:
- name: Azure Cloud Account
  description: Onboard Azure accounts
  type: Onboarding
paths:
  /v2/AzureCloudAccount/{id}/DeleteForce:
    delete:
      tags:
      - Azure Cloud Account
      summary: Delete an Azure account from a Dome9 account (the Azure account is not deleted…
      operationId: AzureCloudAccount_DeleteForce
      parameters:
      - name: id
        in: path
        description: the Dome9 account id for the account or the Subscription id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
  /v2/AzureCloudAccount/OnboardingExecutionPreview:
    get:
      tags:
      - Azure Cloud Account
      summary: Get the script that performs Azure account onboarding
      operationId: AzureCloudAccount_GetOnboardingScriptForPreviewAsync
      responses:
        '200':
          description: OK
  /v2/AzureCloudAccount/OnboardingExecutionCommand:
    post:
      tags:
      - Azure Cloud Account
      summary: Get the cloud account command line execution for Azure shell Details for Azure…
      operationId: AzureCloudAccount_GenerateOnboardingExecutionCommand
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CGN.Common.Model.CloudAccounts.Onboarding.AzureSimplifiedOnboardingExecCmdRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CGN.Common.Model.CloudAccounts.Onboarding.AzureSimplifiedOnboardingExecCmdRequest'
          text/html:
            schema:
              $ref: '#/components/schemas/CGN.Common.Model.CloudAccounts.Onboarding.AzureSimplifiedOnboardingExecCmdRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/CGN.Common.Model.CloudAccounts.Onboarding.AzureSimplifiedOnboardingExecCmdRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/CGN.Common.Model.CloudAccounts.Onboarding.AzureSimplifiedOnboardingExecCmdRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CGN.Common.Model.CloudAccounts.Onboarding.AzureSimplifiedOnboardingExecCmdRequest'
        required: true
