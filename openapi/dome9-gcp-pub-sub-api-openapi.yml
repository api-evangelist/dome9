        id:
          type: string
        cloudAccountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
    Dome9.Web.Api.Google.PubSub.GcpPubSubIamPolicyViewModel:
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Dome9.Web.Api.Google.PubSub.GcpPubSubIamPolicyViewModel.GcpPubSubPolicyBindingViewModel'
        eTag:
          type: string
        version:
          format: int32
          type: integer
    Dome9.Web.Api.Google.PubSub.GcpPubSubIamPolicyViewModel.GcpPubSubPolicyBindingViewModel:
      type: object
      properties:
        condition:
          type: object
        members:
          type: array
          items:
            type: string
        role:
          type: string
  securitySchemes:
    API_key_V2:
      type: http
      scheme: basic
