        allowedRegions:
          type: array
          items:
            type: string
    Dome9.Web.Api.Google.PubSub.GcpPubSubSubscriptionViewModel:
      type: object
      properties:
        ackDeadlineSeconds:
          format: int32
          type: integer
        labels:
          type: object
          additionalProperties:
            type: string
        messageRetentionDuration:
          format: int64
          type: integer
        pushConfig:
          type: string
        retainAckedMessages:
          type: boolean
        topic:
          type: string
        id:
          type: string
        cloudAccountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
