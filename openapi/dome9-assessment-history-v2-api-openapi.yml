openapi: 3.2.0
info:
  version: v2
  title: Dome9. Assessment History V2 API
  description: Compliance Assessment History
servers:
- url: https://api.dome9.com
tags:
- name: Assessment History V2
  description: Compliance Assessment History
  type: PostureManagement
paths:
  /v2/AssessmentHistoryV2/bundleResults:
    get:
      tags:
      - Assessment History V2
      summary: Get most recent assessment results for a specific bundle, for a list of cloud…
      operationId: AssessmentHistoryV2_GetBundleResults
      parameters:
      - name: bundleId
        in: query
        description: the bundle used for the assessment (for all the accounts in the list)
        required: true
        schema:
          type: integer
          format: int64
      - name: cloudAccountIds
        in: query
        description: comma separated list of cloud accounts
        required: true
        schema:
          type: string
      - name: fromTime
        in: query
        description: the time the assessment was done
        required: true
        schema:
          type: string
          format: date-time
      - name: epsilonInMinutes
        in: query
        description: period of time (in min) back from the fromTime to look for results; only results in this range will be returned
        required: false
        schema:
          type: integer
          format: int64
      - name: requestId
        in: query
        description: an optional request id; the same value will appear in the response
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Falconetix.Model.RuleEngine.ViewModels.AssessmentHistory.V2.AssessmentHistoryResultV2ViewModel_Newtonsoft.Json.Linq.JRaw'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Falconetix.Model.RuleEngine.ViewModels.AssessmentHistory.V2.AssessmentHistoryResultV2ViewModel_Newtonsoft.Json.Linq.JRaw'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Falconetix.Model.RuleEngine.ViewModels.AssessmentHistory.V2.AssessmentHistoryResultV2ViewModel_Newtonsoft.Json.Linq.JRaw'
  /v2/AssessmentHistoryV2/assessmentTrendOrganizationalUnit:
    get:
      tags:
      - Assessment History V2
      summary: Get the assessment trend for the selected time range (maximum of 93 days)
      operationId: AssessmentHistoryV2_GetAssessmentTrendOrganizationalUnit
      parameters:
      - name: rulesetId
        in: query
        description: Ruleset ID
        required: true
        schema:
          type: integer
          format: int64
      - name: organizationalUnitId
        in: query
        description: Organizational Unit ID
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        description: From Date
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: To Date
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Falconetix.Model.Compliance.AssessmentTrend.AssessmentTrendItemViewModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Falconetix.Model.Compliance.AssessmentTrend.AssessmentTrendItemViewModel'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Falconetix.Model.Compliance.AssessmentTrend.AssessmentTrendItemViewModel'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Falconetix.Model.Compliance.AssessmentTrend.AssessmentTrendItemViewModel'
            text/xml:
