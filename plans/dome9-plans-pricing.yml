  priced tiers for this product.
plan_count: 0
plans: []
pricing_model:
  style: quote-only
  metered_on: billable cloud assets
  detail: >-
    Licensing is a function of which CloudGuard capabilities are enabled and how
    many billable assets are protected, and the asset ratio differs by resource
    type (an EC2 instance counts as one asset; Lambda functions are counted in
    batches). Check Point publishes no per-asset dollar figure, no starting
    price and no enterprise ceiling. Both the AWS and Azure Marketplace listings
    are private-offer / contact-seller rather than public list price. The API
    itself exposes the tenant's own licensing state
    (/v2/account/license, /v2/account/plan, /v2/BillableAssets,
    /v2/BillableAssetsReport) but that is per-account entitlement data behind
    authentication, not a public price list.
note: >-
  REPLACES a 2026-05-04 bulk-sweep scaffold that invented three tiers
  (dome9-free / dome9-pro / dome9-enterprise) with 1,000 and 100,000 monthly
  request quotas and "TBD" prices. Check Point has never published those. An
  honest plan_count of 0 with a stated reason is the correct measurement:
  CloudGuard is an enterprise sales-led product and its pricing is not a
  self-serve, published artifact.
