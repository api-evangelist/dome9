  detail: >-
    All 601 paths are prefixed /v2. Check Point publishes no version history,
    no "current vs previous version" table and no sunset schedule for v1.
  policy_url: null
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: 0
  detail: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation headers, and NOT ONE
    operation in the contract carries `deprecated: true` — despite the surface
    plainly containing superseded generations. The evidence of retirement is in
    naming, not in metadata.
  superseded_in_place:
  - old: /v2/ComplianceRemediation (operationIds ComplianceRemediationOld_*)
    new: /v2/Compliance/Remediation
    note: The operationId literally says "Old"; the operation is not marked deprecated.
  - old: /v2/AssessmentHistory
    new: /v2/AssessmentHistoryV2
  - old: /v2/ContinuousCompliancePolicy
    new: /v2/ContinuousCompliancePolicyV2
  - old: /v2/KubernetesImageAssurancePolicy, /v2/ShiftLeftPolicy
    new: /v2/vulnerability/policy
    note: >-
      The docs summaries say "(move to use /v2/vulnerability/policy)" in prose.
      That is the only migration signal an agent gets, and it is unreadable to a
      machine.
  agent_warning: >-
    A client cannot detect retirement from this contract. Nothing is flagged and
    nothing is dated — you have to read operationId spelling and summary prose.
