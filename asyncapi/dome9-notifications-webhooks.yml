gaps:
- No AsyncAPI document, so the event payloads themselves have no machine-readable schema.
- No signature or shared-secret verification on the generic webhook channel.
- No documented retry/backoff policy; the only delivery-failure signal is the CircuitBreaker resource.
- No replay-by-time API; the only replay is PublishOpenedFindings, which resends ALL open findings for a policy.
