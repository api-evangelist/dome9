  - operationId: ContinuousComplianceNotification_PublishOpenedFindingsByPolicyIdAsync
    method: POST
    path: /v2/Compliance/ContinuousComplianceNotification/PublishOpenedFindings/{id}
    purpose: replay every open finding through a policy (resync a destination)
  - operationId: ContinuousComplianceNotification_WebhookJiraTokens
    method: GET
    path: /v2/Compliance/ContinuousComplianceNotification/webhookJiraTokens
    purpose: list Jira webhook tokens
  - operationId: ContinuousComplianceNotification_GetAllCircuitBreakerAsync
    method: GET
    path: /v2/Compliance/ContinuousComplianceNotification/CircuitBreaker
    purpose: >-
      list tripped circuit breakers — CloudGuard disables a delivery integration
      that keeps failing, and this is how a consumer discovers that its endpoint
      was cut off
  - operationId: ContinuousComplianceNotification_DeleteCircuitBreakerAsync
    method: DELETE
    path: /v2/Compliance/ContinuousComplianceNotification/CircuitBreaker/{id}/{integrationType}
    purpose: reset a tripped circuit breaker
