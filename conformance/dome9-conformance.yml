domain_standards:
- id: cloud-findings-interchange
  conforms: true
  market: cloud security posture management
  evidence: >-
    The ContinuousComplianceNotification resource declares first-class
    integrations with the three cloud-native findings sinks by name —
    AwsSecurityHubIntegrationNotificationViewModel,
    AzureSecurityCenterIntegrationNotificationViewModel and
    GcpSecurityCommandCenterIntegrationViewModel (with projectId + sourceId).
    Emitting into AWS Security Hub means emitting ASFF; into GCP SCC means the
    SCC finding shape. This is the CSPM market's actual interchange layer and
    the contract speaks it natively rather than through a bespoke connector.
  spec_location: >-
    definitions.Dome9.Web.Api.Compliance.ContinuousCompliance.{AwsSecurityHubIntegrationNotificationViewModel,AzureSecurityCenterIntegrationNotificationViewModel,GcpSecurityCommandCenterIntegrationViewModel}
- id: siem-export-formats
  conforms: true
  market: security operations
  evidence: >-
    WebhookNotificationDataViewModel.formatType and
    SnsDataNotificationViewModel.snsOutputFormat both enumerate named
    downstream formats — SplunkBasic, QRadar, ServiceNow, Jira — alongside the
    generic JSON shapes. The contract commits to specific SIEM/ITSM payload
    dialects rather than leaving the consumer to transform.
  spec_location: definitions...WebhookNotificationDataViewModel.formatType
- id: external-findings-ingest
  conforms: true
  market: cloud security posture management
  evidence: >-
    /v2/ExternalFindings (POST/search/archive/delete) accepts findings from
    third-party scanners into the CloudGuard finding model, making the platform
    a two-way participant in findings interchange rather than an emitter only.
- id: compliance-frameworks
  conforms: true
  market: regulated cloud workloads
  evidence: >-
    The Compliance Ruleset surface (/v2/Compliance/Ruleset,
    /v2/ContinuousCompliancePolicyV2, /v2/assessment/bundleV2) is the API-level
    expression of published control frameworks — the rulesets CloudGuard ships
    are the CIS Benchmarks, PCI DSS, NIST, HIPAA, GDPR and ISO control sets.
    Recorded as a domain signature because the contract exposes framework
    evaluation as a first-class resource, not because a marketing page claims
    the certifications.
  caveat: >-
    The ruleset CONTENT is account-scoped and behind authentication, so the
    specific framework list cannot be verified anonymously from the contract.
