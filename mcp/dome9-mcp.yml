findings:
  first_party_server: false
  note: >-
    Check Point DOES ship an official MCP suite at
    github.com/CheckPointSW/mcp-servers (npm scope @chkp/*) — Quantum
    Management, Threat Prevention, Harmony SASE, Harmony Email, Exposure
    Management, Workforce AI, Check Point WAF and others, all local-stdio via
    `npx -y @chkp/<name>-mcp`. NONE of them speaks to api.dome9.com. The one
    package whose name suggested it might — @chkp/cloudguard-waf-mcp — is a
    published tombstone ("DEPRECATED: renamed to @chkp/checkpoint-waf-mcp. This
    package is a tombstone and no longer functional") and in any case targeted
    Check Point WAF, a sibling product, not the CloudGuard Posture API this
    record describes. So the 722-operation CloudGuard REST surface has no agent
    door of any kind: no remote endpoint, no stdio package.
  checked:
  - https://github.com/CheckPointSW/mcp-servers
  - https://registry.npmjs.org/-/v1/search?text=checkpoint%20mcp
  - https://github.com/dome9
  - https://docs.cgn.portal.checkpoint.com/llms.txt
authentication:
  type: http-basic
  note: >-
    Any future server would carry the same credential as the REST API — HTTP
    Basic where the username is the V2 API key id and the password is the key
    secret, minted in the CloudGuard portal under Settings > Credentials.
    Permissions equal those of the user who created the key.
