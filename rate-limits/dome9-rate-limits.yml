note: >-
  REPLACES a 2026-05-04 bulk-sweep scaffold that asserted free/professional/
  enterprise tiers at 10/100/1000 requests per minute with X-RateLimit-* headers
  and monthly quotas. None of that was published by Check Point — it was
  placeholder data and is removed. What the provider actually publishes:
  nothing. The API reference introduction documents base URLs and regions but
  says nothing about throttling; the 865-line llms.txt index contains no
  rate-limit page (/reference/rate-limits.md returns 404); and the contract
  declares no 429 response and no RateLimit-* or Retry-After header on any of
  its 722 operations. The apis.yml pointer that claimed
  https://api-v2-docs.dome9.com/#section/Rate-Limiting was a stale Redoc anchor
  — that docs site now redirects to a ReadMe hub with no such section — and has
  been removed.
