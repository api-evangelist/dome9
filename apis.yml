aid: dome9
name: Dome9
description: >-
  Dome9, acquired by Check Point in 2018 and now sold as Check Point CloudGuard,
  provides cloud security posture management and compliance across AWS, Azure,
  Google Cloud, Alibaba Cloud, Kubernetes and container registries. Its v2 REST
  API at api.dome9.com is a large, genuinely public surface — 601 paths and 722
  operations described by a first-party Swagger 2.0 contract the API host serves
  itself — covering cloud-account onboarding, compliance rulesets and
  assessments, posture findings and alerts, security groups and firewall policy,
  just-in-time access leases, users, roles and service accounts, plus outbound
  delivery of findings to webhooks, SNS, Slack, Teams, ITSM systems and the
  AWS/Azure/GCP native findings sinks.
type: Index
